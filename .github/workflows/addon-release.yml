name: Addon Release

on:
  workflow_call:
    secrets:
      CF_API_KEY:
        required: true

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.targets.outputs.json }}
    steps:
      - name: Check out addon and tooling
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install wowlua
        run: |
          curl -fsSL https://github.com/DomenikIrrgang/wowlua/releases/latest/download/install.sh | WOWLUA_VERSION=v0.13.6 sh
          echo "$HOME/.wowlua/bin" >> "$GITHUB_PATH"

      - name: Validate Lua syntax
        run: ./addon-tooling/scripts/check-lua.sh

      - name: Read target list
        id: targets
        shell: bash
        run: |
          json="$(./addon-tooling/scripts/get-game-targets.sh "$(find . -maxdepth 1 -type f -name '*.toc' -print -quit)" | jq -R -s -c 'split("\n") | map(select(length > 0))')"
          echo "json=${json}" >> "$GITHUB_OUTPUT"

  publish:
    needs: discover
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        game: ${{ fromJSON(needs.discover.outputs.targets) }}
    steps:
      - name: Check out addon and tooling
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Publish package to CurseForge
        uses: BigWigsMods/packager@0f24d2169de3ceb3b79a981311b2ebab4c6160c7
        with:
          args: -l -g ${{ matrix.game }}
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_KEY }}
